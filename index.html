<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación Quince Años</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #f2e6f9;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 60vh;
      overflow: hidden;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 6vw;
      color: #6c3483;
      margin-bottom: 2vh;
      animation: fadeInTitle 3s ease-out forwards;
      text-align: center;
    }

    @keyframes fadeInTitle {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .envelope-container {
      position: relative;
      width: 80%;
      max-width: 300px;
      height: 2vw;
      max-height: 200px;
      perspective: 1000px;
      animation: bounce 3s ease-in-out;
      animation-fill-mode: forwards;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .envelope {
      width: 100%;
      height: 100%;
      background: #d9b3ff;
      border: 2px solid #b266ff;
      border-radius: 5px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #b266ff;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      z-index: 3;
      transform-origin: top;
      animation: openFlap 2s ease-out 3s forwards;
    }

    @keyframes openFlap {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(180deg); }
    }

    .letter {
      position: absolute;
      width: 90%;
      background: #fff0ff;
      color: #FF00FF;
      padding: 2vh;
      box-sizing: border-box;
      z-index: 2;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      opacity: 0;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: flyUp 1s ease-out 3s forwards,
                 fallAndCenter 2s ease-in-out 4s forwards;
      animation-fill-mode: forwards;
    }

    @keyframes flyUp {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 0;
      }
      100% {
        transform: translateX(-50%) translateY(-200px);
        opacity: 1;
      }
    }

    @keyframes fallAndCenter {
      0% {
        transform: translateX(-50%) translateY(-200px);
      }
      100% {
        transform: translate(-50%, -50%);
        top: 50%;
      }
    }

    h1 {
      text-align: center;
      font-size: 5vw;
      margin-bottom: 2vh;
      color: #8e44ad;
      font-family: 'Great Vibes', cursive;
      animation: fadeInUp 2.5s ease-out 6.5s forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      0% {
        transform: translateY(30px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .letter p {
      font-family: 'Great Vibes', cursive;
      font-size: 4vw;
      text-align: center;
      margin: 1vh 0;
    }

    .footer {
      margin-top: 2vh;
      font-weight: bold;
      text-align: center;
    }

    .buttons {
      margin-top: 4vh;
      display: flex;
      justify-content: center;
      gap: 2vw;
      flex-wrap: wrap;
    }

    .buttons a {
      text-decoration: none;
      padding: 1vh 2vw;
      background-color: #b266ff;
      color: white;
      border-radius: 5px;
      font-size: 3vw;
      transition: background 0.3s;
    }

    .buttons a:hover {
      background-color: #9933ff;
    }
  

    @media (max-width: 600px) {
      .main-title {
        font-size: 8vw;
      }

      .envelope-container {
        width: 90%;
        height: 30vw;
      }

      .letter {
        padding: 4vw;
      }

      .buttons a {
        font-size: 5vw;
      }
    }

    @media (max-width: 400px) {
      .main-title {
        font-size: 10vw;
      }

      .letter {
        padding: 6vw;
      }

      .buttons a {
        font-size: 6vw;
      }
    }
  </style>
</head>
<body>

<div class="main-title">Estás invitado a</div>

<div class="envelope-container">
  <div class="envelope">
    <div class="flap"></div>
  </div>
  <div class="letter">
    <h1>Mis Quince Años</h1>
    <p>Con mucha alegría te invito</p>
    <p>a celebrar junto a mí,</p>
    <p>mis inolvidables 15 años.</p>
    <p>🗓️ Sábado 27 de Septiembre</p>
    <p>📍 Urbanizacion Puertas al Rio, 20:00 PM</p>
    <p class="footer">¡Te espero con ilusión!</p>
    <p class="footer">— [Abigail Ricaurte]</p>

    <div class="buttons">
      <a href="https://www.google.com/maps/place/2%C2%B008'12.9%22S+79%C2%B052'19.9%22W/@-2.1369202,-79.8747749,17z/data=!3m1!4b1!4m4!3m3!8m2!3d-2.1369202!4d-79.8722?hl=es&entry=ttu&g_ep=EgoyMDI1MDYzMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="rsvp-btn">🗺️ Ver ubicación</a>
      <a href="https://forms.gle/rGW4XJx4p4kcRh7SA" target="_blank" target="_blank">✅ Confirmar asistencia</a>
    </div>
  </div>
</div>

</body>
</html>
